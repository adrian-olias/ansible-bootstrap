- name: Bootstrap the k3s server
  hosts: vps
  connection: ssh
  become: true
  become_method: sudo
  vars_files:
    - vars/connection.yaml
    - vars/server.yaml
    - vars/argocd.yaml
    - vars/applications.yaml
    - vars/sealed-secrets.yaml
  roles:
    - role: common
      tags: [common]
    - role: firewall
      tags: [firewall]
    - role: k3s
      tags: [k3s]
    - role: sealed-secrets
      tags: [sealed-secrets]
    - role: argocd
      tags: [argocd]

- name: Show the state of the cluster
  ansible.builtin.import_playbook: check.yaml
