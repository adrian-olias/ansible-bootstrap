# k3s installs anything dropped in its manifests folder, and HelmChart
# resources are installed by the Helm controller that comes with k3s.
- name: Install Argo CD with the k3s Helm controller
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/argocd.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: {{ argocd_namespace }}
      ---
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: argocd
        namespace: kube-system
      spec:
        repo: https://argoproj.github.io/argo-helm
        chart: argo-cd
        version: "{{ argocd_chart_version }}"
        targetNamespace: {{ argocd_namespace }}
        valuesContent: |-
          fullnameOverride: argocd
          dex:
            enabled: false

# The Helm controller needs a moment to pick the chart up, so the
# Deployment may not exist yet on the first tries.
- name: Wait for the Argo CD server to be ready
  ansible.builtin.command: >-
    k3s kubectl -n {{ argocd_namespace }}
    rollout status deployment/argocd-server --timeout=60s
  register: argocd_rollout
  until: argocd_rollout.rc == 0
  retries: 20
  delay: 15
  changed_when: false

- name: Give Argo CD read access to helm-charts-wrappers
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: "{{ repo_secret | to_json }}"
  vars:
    repo_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: repo-helm-charts-wrappers
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "{{ wrappers_repo }}"
        sshPrivateKey: "{{ lookup('ansible.builtin.file', wrappers_deploy_key | expanduser) }}"
  register: argocd_repo_secret
  changed_when: "'unchanged' not in argocd_repo_secret.stdout"
  when: wrappers_deploy_key | default('') | length > 0
  no_log: true

# The only Argo CD object created by hand. It turns every <name>-<env>.yaml
# in argocd-wrapper/ of helm-charts-wrappers into an Application, and from
# there everything comes from Git.
# The {{ }} below belong to Argo CD, so !unsafe stops Ansible from reading them.
- name: Create the ApplicationSet of the namespaces
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: "{{ namespaces_appset | to_json }}"
  vars:
    namespaces_appset:
      apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: namespaces
        namespace: "{{ argocd_namespace }}"
      spec:
        goTemplate: true
        goTemplateOptions: ["missingkey=error"]
        generators:
          - git:
              repoURL: "{{ wrappers_repo }}"
              revision: "{{ wrappers_revision }}"
              files:
                # The dash leaves out Chart.yaml.
                - path: argocd-wrapper/*-*.yaml
        template:
          metadata:
            name: !unsafe 'namespace-{{ trimSuffix ".yaml" .path.filename }}'
          spec:
            project: default
            source:
              repoURL: "{{ wrappers_repo }}"
              targetRevision: "{{ wrappers_revision }}"
              path: argocd-wrapper
              helm:
                valueFiles:
                  - !unsafe '{{ .path.filename }}'
                # Same for every namespace, so they live here and not in each file.
                valuesObject:
                  argocd-template:
                    argocdNamespace: "{{ argocd_namespace }}"
                    repo:
                      url: "{{ wrappers_repo }}"
                      revision: "{{ wrappers_revision }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ argocd_namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
  register: argocd_namespaces_appset
  changed_when: "'unchanged' not in argocd_namespaces_appset.stdout"
