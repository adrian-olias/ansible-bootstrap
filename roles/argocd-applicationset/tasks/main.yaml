- name: Give Argo CD read access to helm-charts-wrappers
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: "{{ repo_secret | to_json }}"
  vars:
    repo_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: repo-helm-charts-wrappers
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "{{ wrappers_repo }}"
        sshPrivateKey: "{{ lookup('ansible.builtin.file', wrappers_deploy_key | expanduser) }}"
  register: argocd_repo_secret
  changed_when: "'unchanged' not in argocd_repo_secret.stdout"
  when: wrappers_deploy_key | default('') | length > 0
  no_log: true

# The only Argo CD object created by hand. It turns every environment values
# file in argocd-wrapper/ into one environment Application. That Application
# renders the argocd-wrapper chart, which creates the workload Applications.
# The {{ }} below belong to Argo CD, so !unsafe stops Ansible from reading them.
- name: Create the ApplicationSet of the applications
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: "{{ namespaces_appset | to_json }}"
  vars:
    namespaces_appset:
      apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: applicationset
        namespace: "{{ argocd_namespace }}"
      spec:
        goTemplate: true
        goTemplateOptions: ["missingkey=error"]
        generators:
          - git:
              repoURL: "{{ wrappers_repo }}"
              revision: "{{ wrappers_revision }}"
              files:
                - path: argocd-wrapper/*.yaml
        template:
          metadata:
            name: !unsafe '{{ trimSuffix ".yaml" .path.filename }}'
          spec:
            project: default
            source:
              repoURL: "{{ wrappers_repo }}"
              targetRevision: "{{ wrappers_revision }}"
              path: argocd-wrapper
              helm:
                valueFiles:
                  - !unsafe '{{ .path.filename }}'
                valuesObject:
                  argocd-template:
                    argocdNamespace: "{{ argocd_namespace }}"
                    repo:
                      url: "{{ wrappers_repo }}"
                      revision: "{{ wrappers_revision }}"
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ argocd_namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
  register: argocd_namespaces_appset
  changed_when: "'unchanged' not in argocd_namespaces_appset.stdout"
