- name: Give Argo CD read access to helm-charts-wrappers
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: "{{ repo_secret | to_json }}"
  vars:
    repo_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: repo-helm-charts-wrappers
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "{{ wrappers_repo }}"
        sshPrivateKey: "{{ lookup('ansible.builtin.file', wrappers_deploy_key | expanduser) }}"
  register: argocd_repo_secret
  changed_when: "'unchanged' not in argocd_repo_secret.stdout"
  when: wrappers_deploy_key | default('') | length > 0
  no_log: true

# Every Application lives in the Argo CD namespace. Each child deploys to
# its own namespace, which Argo CD creates with CreateNamespace.
- name: Create the AppProject and ApplicationSet
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: "{{ applications_appset | to_json }}"
  vars:
    applications_appset:
      apiVersion: v1
      kind: List
      items:
        - apiVersion: argoproj.io/v1alpha1
          kind: AppProject
          metadata:
            name: "{{ applications_project }}"
            namespace: "{{ argocd_namespace }}"
          spec:
            description: Environment Applications and their children
            sourceRepos:
              - "{{ wrappers_repo }}"
            destinations:
              # The children each deploy to their own namespace, so any
              # namespace of the local cluster is allowed.
              - server: https://kubernetes.default.svc
                namespace: "*"
            # CreateNamespace needs this. Any other cluster-wide resource
            # stays forbidden.
            clusterResourceWhitelist:
              - group: ""
                kind: Namespace
        # Platform components need cluster-scoped resources (CRDs, ClusterRoles,
        # webhooks, ClusterIssuer), so they get their own project, limited to
        # the cert-manager namespace and the kinds it needs.
        - apiVersion: argoproj.io/v1alpha1
          kind: AppProject
          metadata:
            name: platform
            namespace: "{{ argocd_namespace }}"
          spec:
            description: Cluster platform components
            sourceRepos:
              - https://charts.jetstack.io
              - "{{ wrappers_repo }}"
            destinations:
              - server: https://kubernetes.default.svc
                namespace: cert-manager
              # The chart puts its leader-election Role and RoleBinding here.
              - server: https://kubernetes.default.svc
                namespace: kube-system
            clusterResourceWhitelist:
              - group: ""
                kind: Namespace
              - group: apiextensions.k8s.io
                kind: CustomResourceDefinition
              - group: rbac.authorization.k8s.io
                kind: ClusterRole
              - group: rbac.authorization.k8s.io
                kind: ClusterRoleBinding
              - group: admissionregistration.k8s.io
                kind: ValidatingWebhookConfiguration
              - group: admissionregistration.k8s.io
                kind: MutatingWebhookConfiguration
              - group: cert-manager.io
                kind: ClusterIssuer
        # cert-manager from the official Helm chart. installCRDs installs its CRDs.
        - apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: cert-manager
            namespace: "{{ argocd_namespace }}"
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: platform
            source:
              repoURL: https://charts.jetstack.io
              chart: cert-manager
              targetRevision: v1.17.2
              helm:
                valuesObject:
                  installCRDs: true
            destination:
              server: https://kubernetes.default.svc
              namespace: cert-manager
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
        # The ClusterIssuer lives in Git (platform/cert-manager). It syncs after
        # cert-manager, because its CRDs must exist first.
        - apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: cert-manager-issuers
            namespace: "{{ argocd_namespace }}"
            annotations:
              argocd.argoproj.io/sync-wave: "1"
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: platform
            source:
              repoURL: "{{ wrappers_repo }}"
              targetRevision: "{{ wrappers_revision }}"
              path: platform/cert-manager
            destination:
              server: https://kubernetes.default.svc
              namespace: cert-manager
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
        # Only Cloudflare may reach the HTTPS entrypoint of Traefik. The ranges
        # live in helm-charts-wrappers/platform/traefik-cloudflare/values.yaml.
        - apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: traefik-cloudflare
            namespace: "{{ argocd_namespace }}"
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: platform
            source:
              repoURL: "{{ wrappers_repo }}"
              targetRevision: "{{ wrappers_revision }}"
              path: platform/traefik-cloudflare
            destination:
              server: https://kubernetes.default.svc
              namespace: kube-system
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
        - apiVersion: argoproj.io/v1alpha1
          kind: ApplicationSet
          metadata:
            name: "{{ applicationset_name }}"
            namespace: "{{ argocd_namespace }}"
          spec:
            goTemplate: true
            goTemplateOptions:
              - missingkey=error
            generators:
              - git:
                  repoURL: "{{ wrappers_repo }}"
                  revision: "{{ wrappers_revision }}"
                  files:
                    - path: argocd-wrapper/*.yaml
                    - path: argocd-wrapper/Chart.yaml
                      exclude: true
            template:
              metadata:
                name: !unsafe '{{ trimSuffix ".yaml" .path.filename }}'
                namespace: "{{ argocd_namespace }}"
                finalizers:
                  - resources-finalizer.argocd.argoproj.io
              spec:
                project: "{{ applications_project }}"
                source:
                  repoURL: "{{ wrappers_repo }}"
                  targetRevision: "{{ wrappers_revision }}"
                  path: argocd-wrapper
                  helm:
                    valueFiles:
                      - !unsafe '{{ .path.filename }}'
                    # Platform settings come from here, not from the
                    # environment files, so they cannot drift apart.
                    valuesObject:
                      argocd-template:
                        argocdNamespace: "{{ argocd_namespace }}"
                        project: "{{ applications_project }}"
                        repo:
                          url: "{{ wrappers_repo }}"
                          revision: "{{ wrappers_revision }}"
                destination:
                  server: https://kubernetes.default.svc
                  namespace: "{{ argocd_namespace }}"
                syncPolicy:
                  automated:
                    prune: true
                    selfHeal: true
                  syncOptions:
                    - PruneLast=true
  register: applications_appset_result
  changed_when: "'unchanged' not in applications_appset_result.stdout"
