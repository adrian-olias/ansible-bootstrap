- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# Rules go in before the firewall is enabled, so SSH never gets cut.
- name: Allow public TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_open_ports }}"

- name: Allow traffic from the cluster networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop: "{{ firewall_trusted_cidrs }}"

- name: Deny everything else and enable the firewall
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
