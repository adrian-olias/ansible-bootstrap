# Server
timezone: Europe/Madrid

# Open to the internet. The Kubernetes API (6443) is not: reach it through SSH.
firewall_open_ports: [22, 80, 443]
# Default pod and service networks of k3s. They need to reach each other and the node.
firewall_trusted_cidrs: [10.42.0.0/16, 10.43.0.0/16]

# k3s. Pinned on purpose: bump and run site.yml again to upgrade.
k3s_version: v1.36.5+k3s1
k3s_tls_san: []

# Where the kubeconfig lands on the machine running Ansible.
kubeconfig_dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/{{ inventory_hostname }}.yaml"

# Argo CD
argocd_namespace: argocd
# Version of the argo-cd Helm chart, not of Argo CD itself.
argocd_chart_version: "10.11.1"
argocd_config_repo: git@github.com:adrian-olias/argocd-config.git
argocd_config_revision: main
# Read-only deploy key of argocd-config, on the machine running Ansible.
# Set it to "" once the repo is public.
argocd_config_deploy_key: ~/.ssh/argocd_config_deploy
